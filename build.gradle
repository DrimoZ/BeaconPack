plugins {
    id 'java-library'
    id 'maven-publish'
    // ModDevGradle 2.x — the current NeoForge build plugin for 1.21.x
    id 'net.neoforged.moddev' version '2.0.78'
}

version = "${mod_version}+${minecraft_version}"
group = mod_group_id
base { archivesName = mod_id }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        // Human-readable parameter names. Purely a dev-time nicety.
        minecraftVersion = '1.21.1'
        mappingsVersion = '2024.11.17'
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        data {
            // 1.21.1 has a single datagen run; clientData()/serverData() only exist from 1.21.4 on.
            data()
        }
        configureEach {
            gameDirectory = project.file('run')
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    // Puts Minecraft on the test classpath. The core/ tests only need types like ResourceKey,
    // but without this the test source set sees no Minecraft classes at all.
    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'Curios / Trinkets (soft dependency, phase 3)'
        url = 'https://maven.blamejared.com'
    }
}

dependencies {
    // Pure-logic classes under core/ are plain Java and unit-testable.
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

test {
    useJUnitPlatform()
}

// Expand gradle.properties into neoforge.mods.toml so versions live in one place.
var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into "${layout.buildDirectory.get()}/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

publishing {
    publications.register('mavenJava', MavenPublication) {
        from components.java
    }
    repositories {
        maven { url = "file://${project.projectDir}/repo" }
    }
}
